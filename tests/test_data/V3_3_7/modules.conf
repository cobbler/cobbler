# cobbler module configuration file
#
# Documentation: https://cobbler.readthedocs.io/en/latest/cobbler-conf.html#modules-conf
#
# NOTE: These values are intentionally *not* the V4.0.0 migration's hardcoded
# fallback defaults (see cobbler/settings/migrations/V4_0_0.py). Using non-default
# values here is what makes tests/settings/migrations/migrations_test.py's
# modules.conf propagation test meaningful - see MIGRATION_4_0_0_VERIFICATION_LOG.md.

[authentication]
module = authentication.ldap
hash_algorithm = sha2_256

[authorization]
module = authorization.ownership

[dns]
module = managers.dnsmasq

[dhcp]
module = managers.dnsmasq

[tftpd]
module = managers.in_tftpd

[serializers]
module = serializers.sqlite
