[loggers]
keys=root,nsupdate

[handlers]
keys=FileLogger,stdout,NsupdateFileLogger

[formatters]
keys=Logfile,stdout

[logger_root]
level=DEBUG
handlers=FileLogger,stdout

[logger_parser]
level=DEBUG
handlers=FileLogger
propagate=1
qualname=compiler.parser

# Dedicated logger for the nsupdate_add_system_post/nsupdate_delete_system_pre triggers. Kept separate from the
# root logger (propagate=0) so dynamic DNS update activity has its own dedicated file, while still reaching
# stdout like everything else so it is visible when running in a container.
[logger_nsupdate]
level=DEBUG
handlers=NsupdateFileLogger,stdout
qualname=nsupdate
propagate=0

[handler_stdout]
class=StreamHandler
level=WARNING
formatter=stdout
args=(sys.stdout,)

# Example rotating log file handler in case you do want to use
# the python rotation way instead of logrotate tool
#[handler_FileLogger]
#class=handlers.RotatingFileHandler
#level=DEBUG
#formatter=Logfile
# Use logrotation if file is bigger than 10MB for up to 50 rotations
#args=('/var/log/cobbler/cobbler.log', 'a', 10*1024*1024, 50)

[handler_FileLogger]
class=FileHandler
level=INFO
formatter=Logfile
args=('/var/log/cobbler/cobbler.log', 'a')

[handler_NsupdateFileLogger]
class=FileHandler
level=DEBUG
formatter=Logfile
args=('/var/log/cobbler/nsupdate.log', 'a')

[formatter_Logfile]
format=[%(threadName)s] %(asctime)s - %(levelname)s | %(message)s
datefmt=%Y-%m-%dT%H:%M:%S
class=logging.Formatter

[formatter_stdout]
format=%(levelname)s | %(message)s
class=logging.Formatter
