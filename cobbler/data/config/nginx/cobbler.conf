server {
  listen 80;
  server_name cobbler.example.com;
  disable_symlinks off;

  # path for static files
  root @@webroot@@/cobbler;

  location / {
    try_files $uri $uri/;
  }

  location /cobbler {
    root @@webroot@@/cobbler;
  }

  # With modules.httpd.module/modules.tftpd.module = managers.dynamic_httpd/managers.dynamic_tftp, replace with:
  #   location /httpboot { proxy_pass http://127.0.0.1:8000/httpboot; }
  #   location /images { proxy_pass http://127.0.0.1:8000/images; }
  # See docs/installation-guide.rst.
  location /httpboot {
    alias @@tftproot@@/grub;
  }

  location /images {
    alias @@tftproot@@/grub/images;
  }

  location /cobbler_api {
      proxy_pass http://127.0.0.1:25151/;
  }

  location /cblr/svc/ {
    proxy_pass http://127.0.0.1:8000/;
  }
}
