# docker/compose/base.yml
#
# Shared resources included by both compose.yml and compose.dev.yml: the "cobbler" network, every named
# volume, the shared "cobbler-settings" config, and the Traefik reverse proxy. Full walkthrough:
# docs/user-guide/docker-deployment.rst.

networks:
  cobbler:
    driver: bridge

volumes:
  cobbler-etc:
  cobbler-var-lib:
  cobbler-webdir:
  cobbler-tftproot:
  cobbler-dhcp-config:
  cobbler-dns-config:
  cobbler-dns-zones:

configs:
  cobbler-settings:
    content: |
      tftpboot_location: "/srv/tftpboot"
      webdir: "/srv/www/cobbler"
      manage_tftpd: false
      bind_zonefile_path: "/var/lib/named"

      modules:
        authentication:
          module: "authentication.configfile"
          hash_algorithm: "sha3_512"
        authorization:
          module: "authorization.allowall"
        dns:
          module: "managers.bind"
        dhcp:
          module: "managers.isc"
        httpd:
          module: "managers.dynamic_httpd"
        tftpd:
          module: "managers.dynamic_tftp"
        process_management:
          module: "auto"
          docker_socket_path: "/var/run/docker.sock"
          docker_service_labels:
            dhcpd: "dhcp"
            dhcpd4: "dhcp"
            dhcpd6: "dhcp"
            named: "dns"
            dnsmasq: "dnsmasq"
        serializers:
          module: "serializers.file"

  # Overrides the RPM-shipped /etc/cobbler/logging_config.conf for the "cobblerd" service: raises
  # handler_stdout to DEBUG (root logger is already DEBUG) so debug-level output actually reaches
  # "docker compose logs cobblerd" instead of being filtered out by the handler, and drops the FileHandler
  # entirely -- containers log to stdout, not to a file that would silently accumulate inside the container
  # (or need its own volume/rotation) at /var/log/cobbler/cobbler.log.
  cobbler-logging-config:
    content: |
      [loggers]
      keys=root

      [handlers]
      keys=stdout

      [formatters]
      keys=stdout

      [logger_root]
      level=DEBUG
      handlers=stdout

      [handler_stdout]
      class=StreamHandler
      level=DEBUG
      formatter=stdout
      args=(sys.stdout,)

      [formatter_stdout]
      format=%(levelname)s | %(message)s
      class=logging.Formatter

services:
  traefik:
    image: traefik:v3.6
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    networks:
      - cobbler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label:disable
    restart: unless-stopped
