[build-system]
requires = ["coverage", "distro", "sphinx", "setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
known_cobbler="cobbler"
known_tests="tests"
sections="FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,LOCALFOLDER,COBBLER,TESTS"
extend_skip = ["system-tests"]

[tool.pyright]
pythonVersion = "3.6"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "cobbler/cli.py", "venv", ".venv", "tests/cli/*.py", "contrib/**/*.py"]

[tool.setuptools_scm]
# Non-code configuration stays here
version_file = "cobbler/_version.py"
version_file_template = """# Auto-generated by setuptools_scm — do not edit
__version__ = "{version}"
__gitstamp__ = "{scm_version.node}"
__gitdate__ = "{scm_version.node_date}"
__builddate__ = "{scm_version.time}"
"""
