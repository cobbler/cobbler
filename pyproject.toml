[build-system]
requires = ["coverage", "distro", "sphinx", "setuptools", "setuptools_scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobbler"
description = "Network Boot and Update Server"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [{name = "Team Cobbler", email = "cobbler.project@gmail.com"}]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.11"
keywords = ["pxe", "autoinstallation", "dhcp", "tftp", "provisioning"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["version"]
dependencies = [
    "requests",
    "pyyaml",
    "netaddr",
    "Cheetah3",
    "distro",
    "python-ldap",
    "dnspython",
    "file-magic",
    "schema",
    "systemd-python",
    "gunicorn",
    "libcobblersignatures>=0.5.1",
]

[project.urls]
Website = "https://cobbler.github.io"
"Documentation (Users)" = "https://cobbler.readthedocs.io/en/latest"
"Documentation (Devs)" = "https://github.com/cobbler/cobbler/wiki"
Source = "https://github.com/cobbler/cobbler"
Tracker = "https://github.com/cobbler/cobbler/issues"

[project.scripts]
cobblerd = "cobbler.cobblerd:main"
cobbler-settings = "cobbler.settings.cli:main"

[project.optional-dependencies]
mongodb = ["pymongo"]
docker = ["docker>=6.0"]
windows = ["pefile"]
extra = ["psutil"]
kerberos = ["gssapi"]
lint = [
    "importlib-resources",
    "pyflakes",
    "pycodestyle",
    "pylint",
    "black==25.1.0",
    "types-requests",
    "types-PyYAML",
    "types-psutil",
    "types-netaddr",
    "types-setuptools",
    "types-dataclasses",
    "types-mock==5.1.*",
    "types-urllib3",
    "isort",
    "pre-commit",
]
test = [
    "pytest>6",
    "pytest-cov",
    "coverage",
    "pytest-mock>3.3.0",
    "pytest-benchmark",
    "legacycrypt; python_version > '3.12'",
]
docs = ["sphinx", "sphinx-rtd-theme", "sphinxcontrib-apidoc"]
changelog = ["towncrier>=22.8.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["*tests*", "contrib*", "docs", "bin"]

[tool.isort]
profile = "black"
known_cobbler="cobbler"
known_tests="tests"
sections="FUTURE,STDLIB,FIRSTPARTY,THIRDPARTY,LOCALFOLDER,COBBLER,TESTS"
extend_skip = ["system-tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
exclude = ["build", "cobbler/cli.py", "venv", ".venv", "tests/cli/*.py", "contrib/**/*.py"]

[tool.setuptools_scm]
# Non-code configuration stays here
fallback_version = "4.0.0"
version_file = "cobbler/_version.py"
version_file_template = """# Auto-generated by setuptools_scm — do not edit
__version__ = "{version}"
__gitstamp__ = "{scm_version.node}"
__gitdate__ = "{scm_version.node_date}"
__builddate__ = "{scm_version.time}"
"""
