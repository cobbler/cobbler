name: Testing Cobbler

on:
  push:
    branches: [main, release*]
  pull_request:
    branches: [main, release*]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    name: "Detect Docker changes"
    outputs:
      docker_changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for docker/ changes
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- docker/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    runs-on: ubuntu-latest
    name: "Unit-Tests"
    needs: detect-changes
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      # The published image is only rebuilt by OBS on push to main, so a PR changing docker/ needs to build fresh;
      # otherwise reuse it so Compose doesn't rebuild it from scratch (image: in compose.yml matches this tag, so a
      # present pull is reused as-is and a missing one is built).
      - name: Pull Docker Test Container
        if: needs.detect-changes.outputs.docker_changed != 'true'
        run: docker pull registry.opensuse.org/systemsmanagement/cobbler/github-ci/containers/cobbler-test-github:main
      - name: Build Docker Test Container
        if: needs.detect-changes.outputs.docker_changed == 'true'
        run: docker compose -f docker/tests/compose.yml build
      - name: Run Docker Compose Stack
        run: docker compose -f docker/tests/compose.yml up -d
      - name: Setup Cobbler in the Container
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker compose -f docker/tests/compose.yml exec -it cobbler bash -c "./docker/develop/scripts/setup-supervisor.sh"
      - name: Mark Git repository as safe
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker compose -f docker/tests/compose.yml exec -it cobbler bash -c "git config --global --add safe.directory /code"
      - name: Run the Tests inside the Docker Container
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker compose -f docker/tests/compose.yml exec -it cobbler bash -c "pytest -m 'not integration' --cov=./cobbler --benchmark-skip && coverage xml"
      - name: Stop and remove the container
        run: docker compose -f docker/tests/compose.yml down
      - name: Upload coverage report to GH artifacts
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
  integration-tests:
    runs-on: ubuntu-latest
    name: "Integration-Tests - ${{ matrix.test }}"
    needs: detect-changes
    strategy:
      fail-fast: false
      matrix:
        test: [basic_test, buildiso_test, import_test, settings_cli_test, svc_test]
    steps:
      - name: Checkout repository
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      # The published image is only rebuilt by OBS on push to main, so a PR changing docker/ would otherwise test against a stale image.
      - name: Pull Docker Test Container
        if: needs.detect-changes.outputs.docker_changed != 'true'
        run: docker pull registry.opensuse.org/systemsmanagement/cobbler/github-ci/containers/cobbler-test-github:main
      - name: Build Docker Test Container locally (docker/ changed in this PR)
        if: needs.detect-changes.outputs.docker_changed == 'true'
        run: docker build -f docker/develop/develop.dockerfile -t registry.opensuse.org/systemsmanagement/cobbler/github-ci/containers/cobbler-test-github:main .
      - name: Run previously built Docker Container
        run: docker run --privileged -t -d -v $PWD:/code --name cobbler registry.opensuse.org/systemsmanagement/cobbler/github-ci/containers/cobbler-test-github:main
      - name: Trust the git repository inside the container
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker exec -u 0 -it cobbler bash -c "git config --global --add safe.directory /code"
      - name: Setup Cobbler in the Container
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker exec -u 0 -it cobbler bash -c "./docker/develop/scripts/setup-supervisor.sh"
      - name: Run the import tests inside the Docker container
        shell: 'script -q -e -c "bash {0}"'
        run: |
          docker exec -u 0 -it cobbler bash -c "make SYSTESTS='${{ matrix.test }}' system-test"
      - name: Stop and remove the container
        run: docker stop cobbler && docker rm cobbler
