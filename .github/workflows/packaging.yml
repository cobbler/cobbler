name: Building Cobbler packages

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]

jobs:
  build-rockylinux8-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Rocky Linux 8 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh rl8 docker/rpms/Rocky_Linux_8/Rocky_Linux_8.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-rockylinux-8
          path: |
            rpm-build/*.rpm
  build-rockylinux9-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Rocky Linux 9 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh rl9 docker/rpms/Rocky_Linux_9/Rocky_Linux_9.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-rockylinux-9
          path: |
            rpm-build/*.rpm
  build-fedora34-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Fedora 34 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh fc34 docker/rpms/Fedora_34/Fedora34.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-fedora-34
          path: |
            rpm-build/*.rpm
  build-opensuse-leap-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a openSUSE Leap 15 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-leap docker/rpms/opensuse_leap/openSUSE_Leap15.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-opensuse-leap
          path: |
            rpm-build/*.rpm
  build-opensuse-tumbleweed-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a openSUSE Tumbleweed Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-tumbleweed docker/rpms/opensuse_tumbleweed/openSUSE_TW.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rpms-opensuse-tumbleweed
          path: |
            rpm-build/*.rpm
  build-debian10-debs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Debian 10 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/debs/build-and-install-debs.sh deb10 docker/debs/Debian_10/Debian10.dockerfile
      - name: Archive DEBs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs-debian10
          path: |
            deb-build/DEBS/all/*.deb
  build-debian11-debs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Debian 11 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/debs/build-and-install-debs.sh deb11 docker/debs/Debian_11/Debian11.dockerfile
      - name: Archive DEBs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs-debian11
          path: |
            deb-build/DEBS/all/*.deb
  build-debian12-debs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build a Debian 12 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/debs/build-and-install-debs.sh deb12 docker/debs/Debian_12/Debian12.dockerfile
      - name: Archive DEBs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debs-debian12
          path: |
            deb-build/DEBS/all/*.deb
  build-wheel:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Mark directory as safe for Git
        run: git config --global --add safe.directory /__w/cobbler/cobbler
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      - name: Install system dependencies
        run: >-
          sudo apt-get install -y
          tar
          make
          apache2-dev
          libsasl2-dev
          libldap2-dev
          libssl-dev
          libsystemd-dev
          tree
      - name: Install setup.py dependencies
        run: pip3 install coverage pytest
      - name: Install dependencies
        run: pip3 install .
      - name: Build a binary wheel and a source tarball
        run: make release
      - name: Show tree
        run: tree
      - name: Archive Wheel
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
  create-release:
    name: Build the release and create a GitHub release
    runs-on: ubuntu-latest
    needs: [
      build-rockylinux8-rpms,
      build-rockylinux9-rpms,
      build-fedora34-rpms,
      build-opensuse-leap-rpms,
      build-opensuse-tumbleweed-rpms,
      build-debian10-debs,
      build-debian11-debs,
      build-debian12-debs,
      build-wheel
    ]
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Download all built artifacts
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cobbler ${{ env.RELEASE_VERSION }}
          discussion_category_name: "Announcements"
          files: |
            artifacts/debs-debian10/*.deb
            artifacts/debs-debian11/*.deb
            artifacts/debs-debian12/*.deb
            artifacts/rpms-fedora-34/*.rpm
            artifacts/rpms-opensuse-leap/*.rpm
            artifacts/rpms-opensuse-tumbleweed/*.rpm
            artifacts/rpms-rockylinux-8/*.rpm
            artifacts/rpms-rockylinux-9/*.rpm
            artifacts/wheel/*.tar.gz
            artifacts/wheel/*.whl
          body_path: changelog/${{ env.RELEASE_VERSION }}.md
