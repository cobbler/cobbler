name: Building Cobbler packages

on:
  push:
    branches: [main, release*]
    tags:
      - "v*"
  pull_request:
    branches: [main, release*]

jobs:
  build-rockylinux10-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Build a Rocky Linux 10 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh rl10 docker/rpms/Rocky_Linux_10/Rocky_Linux_10.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-rockylinux-10
          path: |
            rpm-build/RPMS/*.rpm
  build-fedora43-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Build a Fedora 43 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh fc43 docker/rpms/Fedora_43/Fedora43.dockerfile
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-fedora-37
          path: |
            rpm-build/RPMS/*.rpm
  build-opensuse-leap-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Install System dependencies
        run: sudo apt-get install -y rename
      - name: Build a openSUSE Leap 15 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-leap docker/rpms/opensuse_leap/openSUSE_Leap16.dockerfile
      - name: Rename RPM
        run: |
          sudo file-rename -v -d -e 's/(^cobbler.*)-(\d+\.\d+\.\d+)-1\.(\w+)\.rpm/$1-$2-1.leap.$3.rpm/' rpm-build/RPMS/*.rpm
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-opensuse-leap
          path: |
            rpm-build/RPMS/*.rpm
  build-opensuse-tumbleweed-rpms:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Install System dependencies
        run: sudo apt-get install -y rename
      - name: Build a openSUSE Tumbleweed Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/rpms/build-and-install-rpms.sh opensuse-tumbleweed docker/rpms/opensuse_tumbleweed/openSUSE_TW.dockerfile
      - name: Rename RPM
        run: |
          sudo file-rename -v -d -e 's/(^cobbler.*)-(\d+\.\d+\.\d+)-1\.(\w+)\.rpm/$1-$2-1.tw.$3.rpm/' rpm-build/RPMS/*.rpm
      - name: Archive RPMs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-opensuse-tumbleweed
          path: |
            rpm-build/RPMS/*.rpm
  build-debian13-debs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Install System dependencies
        run: sudo apt-get install -y rename
      - name: Build a Debian 13 Package
        shell: 'script -q -e -c "bash {0}"'
        run: |
          ./docker/debs/build-and-install-debs.sh deb13 docker/debs/Debian_13/Debian13.dockerfile
      - name: Rename DEB
        run: |
          sudo file-rename -v -d -e 's/(^cobbler.*)_(\d+\.\d+\.\d+)_all\.deb/$1_$2_all.deb13.deb/' deb-build/*.deb
      - name: Archive DEBs
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debs-debian13
          path: |
            deb-build/*.deb
  build-wheel:
    name: Build Python Wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Mark directory as safe for Git
        run: git config --global --add safe.directory /__w/cobbler/cobbler
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          cache: pip
          cache-dependency-path: "**/setup.py"
          python-version: ">=3.6"
      - name: Update apt cache
        run: >-
          sudo apt-get update
      - name: Install system dependencies
        run: >-
          sudo apt-get install -y
          tar
          make
          libsasl2-dev
          libldap2-dev
          libssl-dev
          libsystemd-dev
          tree
      - name: Install installation dependencies
        run: pip3 install setuptools_scm
      - name: Install dependencies
        run: pip3 install .[docs]
      # Creating the release tarball executes the clean target
      - name: Build the source tarball
        run: make release
      - name: Build the wheel
        run: make build
      - name: Show tree
        run: tree
      - name: Archive Wheel
        # https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: |
            build/cobbler-*.whl
            release/cobbler-*.tar.gz
  create-release:
    name: Build the release and create a GitHub release
    runs-on: ubuntu-latest
    needs:
      [
        build-rockylinux10-rpms,
        build-fedora43-rpms,
        build-opensuse-leap-rpms,
        build-opensuse-tumbleweed-rpms,
        build-debian13-debs,
        build-wheel,
      ]
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download all built artifacts
        # https://github.com/actions/download-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Release
        # https://github.com/softprops/action-gh-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Cobbler ${{ env.RELEASE_VERSION }}
          discussion_category_name: "Announcements"
          files: |
            artifacts/debs-debian11/*.deb
            artifacts/debs-debian12/*.deb
            artifacts/rpms-fedora-37/*.rpm
            artifacts/rpms-opensuse-leap/*.rpm
            artifacts/rpms-opensuse-tumbleweed/*.rpm
            artifacts/rpms-rockylinux-9/*.rpm
            artifacts/wheel/release/*.tar.gz
            artifacts/wheel/build/*.whl
          body_path: changelog/${{ env.RELEASE_VERSION }}.md
