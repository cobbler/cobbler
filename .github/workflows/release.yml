name: Publish Python distributions to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  DATAPATH: "/usr/share/cobbler"
  DOCPATH: "/usr/share/man"
  ETCPATH: "/etc/cobbler"
  LIBPATH: "/var/lib/cobbler"
  LOGPATH: "/var/log"
  COMPLETION_PATH: "/usr/share/bash-completion/completions"
  HTTPD_SERVICE: "apache2.service"
  WEBROOT: "/var/www"
  WEBCONFIG: "/etc/apache2/sites-available"
  WEBROOTCONFIG: "/etc/apache2"
  TFTPROOT: "/srv/tftpboot"
  DEFAULTPATH: "etc/sysconfig"
  APACHE_USER: "www-data"
  HTTP_USER: "www-data"
  APACHE_GROUP: "www-data"

# FIXME: We removed createrepo_c due to: https://answers.launchpad.net/createrepo/+question/690448

jobs:
  build-n-publish:
    if: github.repository == 'cobbler/cobbler'
    name: Build and publish Python distributions to PyPI and TestPyPI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Set up Python 3.9
        # https://github.com/actions/setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.9
      - name: Update package cache
        run: sudo apt-get -yq update
      - name: Install all dependencies
        run: >-
          sudo apt-get -yq install
          wget
          pycodestyle
          pyflakes3
          liblocale-gettext-perl
          lsb-release
          xz-utils
          bzip2
          dpkg-dev
          tftpd-hpa
          rsync
          xorriso
          fence-agents
          fakeroot
          patch
          pax
          git
          hardlink
          apache2
          apache2-dev
          python3-gunicorn
          systemd
          libsasl2-dev
          libsystemd-dev
      - name: Install Deps for installing project
        run: pip install Sphinx coverage wheel setuptools_scm
      - name: Pin version without local part
        # PyPI/TestPyPI reject uploads whose version has a local segment
        # (e.g. "+gabcdef"), which setuptools_scm appends for non-tag commits.
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION=$(python -m setuptools_scm | cut -d'+' -f1)" >> $GITHUB_ENV
      - name: Install Deps with pip
        run: pip install .
      - name: Install pypa/build
        run: python -m pip install build --user
      - name: Build a binary wheel and a source tarball
        run: python -m build
      - name: Publish distribution to Test PyPI
        if: github.ref == 'refs/heads/main'
        # https://github.com/pypa/gh-action-pypi-publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository_url: https://test.pypi.org/legacy/
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        # https://github.com/pypa/gh-action-pypi-publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
