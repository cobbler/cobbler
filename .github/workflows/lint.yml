name: Linting

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # https://github.com/actions/checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python
      # https://github.com/actions/setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: 3.9
    - name: Install dependencies
      run:  pip install -U rstcheck doc8 sphinx
    - name: Run rstcheck
      run:  rstcheck -r docs
    - name: Run doc8
      run: doc8 --ignore D001 docs
  apidoc:
    name: code-autodoc up to date
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      # https://github.com/actions/checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Set up Python
      # https://github.com/actions/setup-python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11"
    - name: Install dependencies
      # Pinned to the exact version docs/code-autodoc/ was generated with - sphinx-apidoc's
      # output formatting (e.g. automodule option order) isn't stable across versions, so an
      # unpinned/newer Sphinx here would flag the committed files as stale for no real reason.
      run: pip install sphinx==8.2.3
    - name: Regenerate code-autodoc
      run: make apidoc
    - name: Check for uncommitted code-autodoc changes
      run: |
        if [ -n "$(git status --porcelain -- docs/code-autodoc/)" ]; then
          echo "::error::docs/code-autodoc/ is out of date. Run 'make apidoc' locally and commit the changes."
          git status --porcelain -- docs/code-autodoc/
          git diff -- docs/code-autodoc/
          exit 1
        fi
  shellscripts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run ShellCheck
        # https://github.com/ludeeus/action-shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'
  pyright:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # setuptools_scm needs the full history (incl. tags) to derive the
          # version; a shallow checkout makes it guess a bogus version.
          fetch-depth: 0
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          cache: 'pip' # caching pip dependencies
          cache-dependency-path: '**/setup.py'
      - name: Update apt cache
        run: >-
          sudo apt-get update
      - name: Install system dependencies
        run: sudo apt-get install -y libldap2-dev libsasl2-dev libsystemd-dev
      - name: Install installation dependencies
        run: pip3 install setuptools_scm
      - name: Generate Python Version
        run: python3 -m setuptools_scm --force-write-version-file
      - name: Install Python dependencies
        run: pip install .[test,extra,docs,lint,mongodb,windows,docker]
      - name: Run Pyright
        # https://github.com/jakebailey/pyright-action
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef # v3.0.2
  python_black:
    name: black formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Black formatter check
        # https://github.com/psf/black
        uses: psf/black@87928e6d6761a4a6d22250e1fee5601b3998086e # 26.5.1
        with:
          options: "--check --diff --safe --verbose"
          version: "22.3.0"
  python_isort:
    name: isort formatter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      - name: isort formatter check
        # https://github.com/isort/isort-action
        uses: isort/isort-action@24d8a7a51d33ca7f36c3f23598dafa33f7071326 # v1.1.1
        with:
          configuration: --check-only --diff --profile=black
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # https://github.com/actions/checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Lint commit messages
        # https://github.com/wagoid/commitlint-github-action
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
